<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://*.googleapis.com https://assets.calendly.com; font-src 'self' https://*.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self' https://calendly.com;" />

  <!-- Primary Meta Tags (Defaults handled by React Helmet) -->
  <title>Memo BauT | Exklusive Gartenkunst</title>
  <meta name="description"
    content="Premium Garten- & Landschaftsbau in Wetzlar. Wir realisieren Traumgärten mit höchster Handwerkskunst." />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

  <!-- Theme Color -->

  <meta name="color-scheme" content="light" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Preloads for Critical Assets -->
  <link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2"
    as="font" type="font/woff2" crossorigin="anonymous">
  <link rel="preload" href="/images/final/hero-home.webp" as="image">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
