<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- TODO: Implement Nonce-based CSP for script-src to strictly enforce prior-blocking (remove global googletagmanager/calendly whitelist) -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://*.googleapis.com https://assets.calendly.com; font-src 'self' https://*.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self' https://calendly.com;" />

  <!-- Primary Meta Tags (Defaults — overridden by React Helmet per page) -->
  <title>Memo BauT | Exklusiver Garten- und Landschaftsbau Wetzlar</title>
  <meta name="description"
    content="Premium Garten- & Landschaftsbau in Wetzlar. Wir realisieren Traumgärten mit höchster Handwerkskunst – Pflasterarbeiten, Terrassenbau, Zaunbau & mehr." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Memo BauT | Exklusiver Garten- und Landschaftsbau Wetzlar" />
  <meta property="og:description" content="Premium Garten- & Landschaftsbau in Wetzlar. Wir realisieren Traumgärten mit höchster Handwerkskunst – Pflasterarbeiten, Terrassenbau, Zaunbau & mehr." />
  <meta property="og:url" content="https://memobaut.de/" />
  <meta property="og:image" content="https://memobaut.de/images/final/hero-home.webp" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Memo BauT | Exklusiver Garten- und Landschaftsbau Wetzlar" />
  <meta name="twitter:description" content="Premium Garten- & Landschaftsbau in Wetzlar. Wir realisieren Traumgärten mit höchster Handwerkskunst – Pflasterarbeiten, Terrassenbau, Zaunbau & mehr." />
  <meta name="twitter:image" content="https://memobaut.de/images/final/hero-home.webp" />
  <!-- Geo & Language Targeting -->
  <link rel="alternate" hreflang="de" href="https://memobaut.de/" />
  <meta name="geo.region" content="DE-HE" />
  <meta name="geo.placename" content="Wetzlar" />
  <meta name="geo.position" content="50.5697;8.4989" />
  <meta name="ICBM" content="50.5697, 8.4989" />

  <!-- Theme Color -->
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#2d5016" />

  <!-- Favicon & PWA -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preloads for Critical Assets -->
  <link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/images/final/hero-home.webp" as="image" fetchpriority="high">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
